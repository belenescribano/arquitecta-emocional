<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Test de Fragmentación Emocional · Arquitecta Emocional</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --marfil:#F5F0E8;--beige:#E8DFD0;--taupe:#BFB5A8;
  --dorado:#C9AA7C;--carbon:#3D3830;--carbon2:#4A443C;
  --sage:#7A8A7E;--mauve:#8A7A8A;--warm:#8A7E6E;--olive:#8A8A7A;
}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif;font-weight:300;
  background:var(--marfil);color:var(--carbon);
  min-height:100vh;overflow-x:hidden;
}
/* ── PROGRESS BAR ── */
.progress-bar{
  position:fixed;top:0;left:0;height:2px;
  background:var(--dorado);z-index:100;
  transition:width 0.4s ease;width:0%;
}
/* ── HEADER ── */
.header{
  position:fixed;top:0;left:0;right:0;
  background:rgba(245,240,232,0.95);backdrop-filter:blur(12px);
  padding:0 30px;height:84px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:90;border-bottom:1px solid rgba(191,181,168,0.3);
}
.header-logo{
  max-width: 420px;
  width: 100%;
  height: auto;
  display: block;
  flex-shrink: 0;
}
.header-tag{font-size:10px;letter-spacing:0.14em;color:var(--taupe);text-transform:uppercase;white-space:nowrap;margin-left:15px;}
/* ── SCREENS ── */
.screen{display:none;min-height:100vh;padding-top:84px;}
.screen.active{display:flex;flex-direction:column;}
/* ── INTRO SCREEN ── */
#screen-intro{
  background:var(--carbon);
  align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
#screen-intro::before{
  content:'';position:absolute;
  top:-120px;right:-120px;width:600px;height:600px;border-radius:50%;
  border:1px solid rgba(201,170,124,0.12);pointer-events:none;
}
#screen-intro::after{
  content:'';position:absolute;
  bottom:-200px;left:-80px;width:500px;height:500px;border-radius:50%;
  border:1px solid rgba(201,170,124,0.07);pointer-events:none;
}
.intro-inner{
  max-width:620px;width:90%;padding:60px 0;
  display:flex;flex-direction:column;gap:0;position:relative;z-index:1;
}
.intro-tag{
  font-size:10px;letter-spacing:0.2em;color:var(--dorado);
  text-transform:uppercase;margin-bottom:20px;
}
.intro-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(38px,6vw,64px);font-weight:400;
  line-height:1.05;color:var(--marfil);
  margin-bottom:6px;
}
.intro-title em{color:var(--dorado);font-style:italic;}
.intro-rule{
  width:48px;height:1px;background:var(--dorado);
  margin:24px 0;
}
.intro-sub{
  font-size:15px;color:var(--taupe);line-height:1.85;
  margin-bottom:32px;max-width:480px;
}
.intro-meta{
  display:flex;gap:24px;margin-bottom:44px;
  font-size:11px;color:var(--taupe);letter-spacing:0.06em;
}
.intro-meta span{display:flex;align-items:center;gap:6px;}
.intro-meta svg{width:13px;height:13px;opacity:0.6;}
.btn-start{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--dorado);color:var(--carbon);
  font-family:'Inter',sans-serif;font-size:11px;font-weight:500;
  letter-spacing:0.12em;text-transform:uppercase;
  padding:14px 28px;border:none;cursor:pointer;
  transition:all 0.2s;align-self:flex-start;
}
.btn-start:hover{background:#d4b88a;transform:translateY(-1px);}
.intro-note{
  margin-top:32px;font-size:12px;color:rgba(191,181,168,0.6);
  font-style:italic;font-family:'Cormorant Garamond',serif;
}
/* ── QUESTION SCREEN ── */
#screen-test{
  background:var(--marfil);
  align-items:center;
  padding-top:64px;
}
.test-wrap{
  max-width:680px;width:90%;padding:60px 0 80px;
  flex:1;display:flex;flex-direction:column;
}
.q-counter{
  font-size:10px;letter-spacing:0.16em;color:var(--dorado);
  text-transform:uppercase;margin-bottom:28px;
}
.q-dimension{
  font-size:11px;letter-spacing:0.12em;color:var(--taupe);
  text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.dim-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
.q-text{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(20px,3.5vw,28px);font-weight:400;
  line-height:1.35;color:var(--carbon);
  margin-bottom:12px;
}
.q-hint{
  font-size:16px;color:var(--carbon);margin-bottom:40px;
  font-style:italic;font-family:'Cormorant Garamond',serif;line-height:1.6;
  font-weight:400;
}
.scale-wrap{display:flex;flex-direction:column;gap:0;margin-bottom:48px;}
.scale-labels{
  display:flex;justify-content:space-between;
  font-size:13px;color:var(--carbon);font-weight:500;letter-spacing:0.08em;
  margin-bottom:10px;text-transform:uppercase;
}
.scale-btns{display:flex;gap:8px;}
.scale-btn{
  flex:1;aspect-ratio:1;
  border:1.5px solid var(--taupe);background:rgba(255,255,255,0.5);
  cursor:pointer;transition:all 0.18s;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;color:var(--carbon);
  position:relative;
}
.scale-btn:hover{border-color:var(--dorado);background:rgba(201,170,124,0.1);color:var(--carbon);}
.scale-btn.selected{
  background:var(--carbon);border-color:var(--carbon);
  color:var(--dorado);
}
.scale-btn .val{font-size:28px;font-weight:500;}
.nav-btns{display:flex;justify-content:space-between;align-items:center;}
.btn-back{
  background:none;border:1px solid rgba(191,181,168,0.4);
  color:var(--taupe);font-size:11px;font-family:'Inter',sans-serif;
  letter-spacing:0.08em;text-transform:uppercase;
  padding:11px 22px;cursor:pointer;transition:all 0.15s;
}
.btn-back:hover{border-color:var(--taupe);color:var(--carbon);}
.btn-next{
  background:var(--carbon);border:none;
  color:var(--marfil);font-size:11px;font-family:'Inter',sans-serif;
  letter-spacing:0.1em;text-transform:uppercase;
  padding:12px 28px;cursor:pointer;transition:all 0.15s;
  display:flex;align-items:center;gap:8px;
}
.btn-next:hover{background:var(--carbon2);}
.btn-next:disabled{opacity:0.35;cursor:not-allowed;}
/* Q transition */
.q-block{transition:opacity 0.25s, transform 0.25s;}
.q-block.fade-out{opacity:0;transform:translateY(8px);}
/* ── EMAIL SCREEN ── */
#screen-email{
  background:var(--beige);
  align-items:center;justify-content:center;
}
.email-inner{max-width:520px;width:90%;padding:60px 0;text-align:center;}
.email-inner .intro-tag{text-align:center;}
.email-title{
  font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4vw,40px);
  font-weight:400;line-height:1.2;color:var(--carbon);margin-bottom:12px;
}
.email-sub{font-size:13.5px;color:var(--carbon2);line-height:1.8;margin-bottom:28px;}
.email-form{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;text-align:left;}
.email-form input{
  background:var(--marfil);border:1px solid rgba(191,181,168,0.8);
  font-family:'Inter',sans-serif;font-size:13px;color:var(--carbon);
  padding:14px 18px;outline:none;width:100%;
  transition:border-color 0.15s;
}
.email-form input:focus{border-color:var(--dorado);}
.email-form input::placeholder{color:var(--taupe);}
.email-privacy{
  font-size:11px;color:var(--taupe);margin-bottom:20px;font-style:italic;
}
.btn-result{
  width:100%;background:var(--dorado);border:none;
  color:var(--carbon);font-family:'Inter',sans-serif;
  font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;
  padding:15px;cursor:pointer;transition:all 0.2s;
}
.btn-result:hover{background:#d4b88a;}
/* ── RESULT SCREEN ── */
#screen-result{background:var(--carbon);}
.result-hero{
  padding:80px 0 60px;
  display:flex;flex-direction:column;align-items:center;
  border-bottom:1px solid rgba(201,170,124,0.2);
}
.result-inner{max-width:700px;width:90%;}
.result-tag{
  font-size:10px;letter-spacing:0.2em;color:var(--dorado);
  text-transform:uppercase;margin-bottom:20px;
}
.result-score-row{
  display:flex;align-items:flex-end;gap:20px;margin-bottom:6px;
}
.result-score{
  font-family:'Cormorant Garamond',serif;font-size:80px;
  font-weight:300;line-height:1;color:var(--dorado);
}
.result-score-label{
  font-size:12px;color:var(--taupe);margin-bottom:18px;
  letter-spacing:0.06em;
}
.result-profile-name{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(28px,4.5vw,44px);font-weight:400;
  color:var(--marfil);line-height:1.15;margin-bottom:8px;
}
.result-profile-name em{color:var(--dorado);font-style:italic;}
.result-profile-sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:16px;color:var(--taupe);margin-bottom:28px;
}
.result-desc{
  font-size:14px;color:rgba(232,223,208,0.85);
  line-height:1.9;max-width:600px;margin-bottom:40px;
}
/* Dimension bars */
.dim-bars{display:flex;flex-direction:column;gap:12px;margin-bottom:48px;}
.dim-bar-item{}
.dim-bar-header{
  display:flex;justify-content:space-between;
  font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--taupe);margin-bottom:6px;
}
.dim-bar-header span:last-child{color:var(--dorado);}
.dim-bar-track{
  height:4px;background:rgba(255,255,255,0.08);
  border-radius:2px;overflow:hidden;
}
.dim-bar-fill{
  height:100%;border-radius:2px;
  background:var(--dorado);
  width:0%;transition:width 1.2s cubic-bezier(0.4,0,0.2,1);
}
